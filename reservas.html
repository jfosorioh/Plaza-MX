<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservas | Plaza MX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-plaza sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="Plaza MX" height="48"></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><i
                    class="bi bi-list text-white fs-2"></i></button>
            <div class="collapse navbar-collapse justify-content-end" id="nav">
                <ul class="navbar-nav gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">NOSOTROS</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">MENÚ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reservas.html">RESERVAS</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">CONTACTO</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="container py-5" style="max-width:760px">
            <h2 class="text-center mb-4">RESERVA TU MESA</h2>
            <form action="confirmacion.html" method="get">
                <label class="form-label">Nombre Completo<span class="req">*</span></label><input
                    class="form-control mb-3" name="nombre" placeholder="Tu nombre" required>
                <label class="form-label">Teléfono<span class="req">*</span></label><input class="form-control mb-3"
                    type="tel" name="tel" placeholder="Tu teléfono" required>
                <div class="row">
                    <div class="col-6"><label class="form-label">Fecha<span class="req">*</span></label><input
                            class="form-control mb-3" type="date" name="fecha" required></div>
                    <div class="col-6"><label class="form-label">Hora<span class="req">*</span></label><input
                            class="form-control mb-3" type="time" name="hora" min="17:00" max="23:59" required></div>
                </div>
                <label class="form-label">Personas<span class="req">*</span></label><select class="form-select mb-3"
                    name="personas" required>
                    <option value="">Selecciona</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>Más de 8</option>
                </select>
                <label class="form-label">Comentarios (opcional)</label><textarea class="form-control mb-3"
                    name="comentarios" rows="4" placeholder="Escribe aquí tu comentario..."></textarea>
                <p>Los campos marcados con <span class="req">*</span> son obligatorios</p><button
                    class="btn btn-gold w-100 btn-lg">RESERVAR MESA</button>
            </form>
        </section>
    </main>
    <footer class="footer-plaza">
        <div class="container">
            <div class="row text-center align-items-center g-3">
                <div class="col-md-3"><img src="img/logo.png" alt="Plaza MX" height="60"></div>
                <div class="col-md-3">
                    <h6>HORARIO</h6>
                    <p>Lunes - Domingo<br>Desde 5PM - 12AM</p>
                </div>
                <div class="col-md-3">
                    <h6>DIRECCIÓN</h6>
                    <p>Carrera 9 16-11<br>Sahagún, Córdoba, Colombia</p>
                </div>
                <div class="col-md-3">
                    <h6>SÍGUENOS</h6><a href="https://instagram.com/plazamx_shg" target="_blank"
                        aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="https://wa.me/573043880559" target="_blank" aria-label="WhatsApp"><i
                            class="bi bi-whatsapp"></i></a>
                </div>
            </div>
            <p class="copy">© 2026 Plaza Mx. Todos los derechos reservados</p>
        </div>
    </footer>
    <a id="wsp" href="https://wa.me/573043880559?text=Hola%20Plaza%20MX%2C%20quisiera%20hacer%20una%20consulta"
        target="_blank" aria-label="Escríbenos por WhatsApp"><i class="bi bi-whatsapp"></i></a>
    <button id="subir" aria-label="Subir"><i class="bi bi-arrow-up"></i></button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
